name: Import verified Elvenland starter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-starter.yml'
      - 'tools/import_starter_handoff.py'
      - 'handoff/starter_transport_manifest.json'
      - 'handoff/starter_parts/**'

permissions:
  contents: write

concurrency:
  group: elvenland-starter-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'geibibro123-linux/Elvenland' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ELVENLAND_RELEASE_TAG: elvenland-ki-startpaket-v1
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Require the confirmed Elvenland baseline
        run: git merge-base --is-ancestor 95483ee1ebe3ee346704ceafc25c6450e81b48bc HEAD

      - name: Validate and import the pinned text-only starter
        run: >-
          python3 tools/import_starter_handoff.py
          --repo "$GITHUB_WORKSPACE"
          --output-dir "$RUNNER_TEMP/elvenland-starter-import"
          --apply

      - name: Commit only the new verified files
        id: content
        shell: bash
        run: |
          set -euo pipefail
          git --literal-pathspecs add \
            --pathspec-from-file="$RUNNER_TEMP/elvenland-starter-import/git_paths.nul" \
            --pathspec-file-nul
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import verified Elvenland starter tables, indices and tools'
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish the small starter ZIP and its checksum
        env:
          ELVENLAND_CONTENT_COMMIT: ${{ steps.content.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$ELVENLAND_RELEASE_TAG" \
            "$RUNNER_TEMP/elvenland-starter-import/Elvenland_KI_Startpaket_v1.zip" \
            "$RUNNER_TEMP/elvenland-starter-import/Elvenland_KI_Startpaket_v1.zip.sha256" \
            --repo geibibro123-linux/Elvenland \
            --target "$ELVENLAND_CONTENT_COMMIT" \
            --title 'Elvenland KI-Startpaket v1, ohne Medien' \
            --notes-file handoff/starter_release_notes.md

      - name: Summarize the exact scope
        shell: bash
        run: |
          {
            echo '## Elvenland KI-Startpaket'
            echo '253 Tabellen, Indizes und Werkzeuge wurden geprüft und importiert; 13 vorhandene Kerndateien wurden bewahrt.'
            echo 'Das kleine Startarchiv und seine SHA-256-Prüfsumme wurden als Release-Dateien hochgeladen.'
            echo 'Das vollständige Medienarchiv und eine spielbare APK sind nicht Bestandteil dieses Workflows.'
            echo 'Die Sichtbarkeit des Repositorys wurde nicht verändert. Bei privater Sichtbarkeit besteht kein anonymer Zugriff.'
          } >> "$GITHUB_STEP_SUMMARY"
