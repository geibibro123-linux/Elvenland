name: Verify original research source extractor
on:
  push:
    paths:
      - ".github/workflows/verify-original-research-extractor.yml"
      - "tools/extract_research_balancing_reference.py"
      - "tests/test_extract_research_balancing_reference.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify strict preservation and safe source handling
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_extract_research_balancing_reference.py' -v
          python -m py_compile tools/extract_research_balancing_reference.py
          python - <<'PY'
          from pathlib import Path
          import json
          active=json.loads(Path('data/definitions/research_nodes.json').read_text(encoding='utf-8'))
          assert active.get('definitions')==[] and active.get('approved_as_elvenland_balance') is False
          print('ACTIVE_RESEARCH_DEFINITIONS_UNCHANGED')
          PY
