name: Verify original research source extractor
on:
  push:
    paths:
      - ".github/workflows/verify-original-research-extractor.yml"
      - "tools/extract_research_balancing_reference.py"
      - "tests/test_extract_research_balancing_reference.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic tests and audit that no active game definitions changed
        run: |
          set -euo pipefail
          python -m py_compile tools/extract_research_balancing_reference.py
          python - <<'PY'
          from pathlib import Path
          import datetime
          import hashlib
          import io
          import json
          import unittest
          loader=unittest.TestLoader()
          suite=loader.discover('tests', pattern='test_extract_research_balancing_reference.py')
          cases=suite.countTestCases()
          stream=io.StringIO()
          result=unittest.TextTestRunner(stream=stream,verbosity=2).run(suite)
          print(stream.getvalue())
          if not result.wasSuccessful() or cases < 10:
              raise SystemExit('RESEARCH_EXTRACTOR_TESTS_FAILED')
          path=Path('data/definitions/research_nodes.json')
          active=json.loads(path.read_text(encoding='utf-8'))
          if active.get('definitions') != [] or active.get('approved_as_elvenland_balance') is not False:
              raise SystemExit('ACTIVE_RESEARCH_DEFINITIONS_MODIFIED')
          report={
              'kind':'ELVENLAND_RESEARCH_EXTRACTOR_SYNTHETIC_TEST',
              'date':'2026-11-21',
              'tests_discovered':cases,
              'tests_run':result.testsRun,
              'failures':len(result.failures),
              'errors':len(result.errors),
              'success':result.wasSuccessful(),
              'only_synthetic_test_fixtures':True,
              'original_elvenar_config_rows_imported':0,
              'active_gameplay_research_definitions':len(active['definitions']),
              'active_definitions_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
              'screenshot_and_video_sources_not_decoded_by_this_test':True
          }
          out=Path('docs/research_extractor_synthetic_validation_2026-11-21.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print('EXTRACTOR_VALIDATION_SUCCESS',cases)
          PY
      - name: Archive successful synthetic test report
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/research_extractor_synthetic_validation_2026-11-21.json
          if ! git diff --cached --quiet; then
            git commit -m "test: record successful synthetic research extractor validation"
            git push
          fi
